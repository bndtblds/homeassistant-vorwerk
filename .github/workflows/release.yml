name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/vorwerk/manifest.json").read_text()
          )
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if manifest["version"] != tag_version:
              raise SystemExit(
                  f"Tag {tag_version} does not match manifest {manifest['version']}"
              )
          PY

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            requirements: requirements_test_min.txt
          - python: "3.14.2"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: python -m pip install -r ${{ matrix.requirements }}

      - name: Run tests
        run: >-
          python -m pytest
          --cov=custom_components.vorwerk
          --cov-report=term-missing
          --cov-fail-under=95

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  publish:
    needs: [version, tests, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
